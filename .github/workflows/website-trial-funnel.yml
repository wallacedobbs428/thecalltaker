name: Website Trial Funnel Regression

on:
  pull_request:
    paths:
      - 'website/index.html'
      - 'website/pricing.html'
      - 'website/checkout.html'
      - 'website/pay.html'
      - 'website/pre-checkout.html'
      - 'website/card-checkout.html'
      - 'website/demo.html'
      - 'website/assets/demo/demo-call-15s.mp3'
      - 'website/book.html'
      - 'website/setup.html'
      - 'website/setup-confirmation.html'
      - 'website/tct-funnel-events.js'
      - 'website/tct-tracking.js'
      - 'website/meet-gideon.html'
      - 'website/pilot/**'
      - 'website/onboarding/**'
      - 'tests/website-trial-funnel.test.js'
      - 'tests/website-buyer-consent-release.test.js'
      - 'tests/website-demo-audio.test.js'
      - '.github/workflows/website-trial-funnel.yml'
  push:
    branches: [main]
    paths:
      - 'website/index.html'
      - 'website/pricing.html'
      - 'website/checkout.html'
      - 'website/pay.html'
      - 'website/pre-checkout.html'
      - 'website/card-checkout.html'
      - 'website/demo.html'
      - 'website/assets/demo/demo-call-15s.mp3'
      - 'website/book.html'
      - 'website/setup.html'
      - 'website/setup-confirmation.html'
      - 'website/tct-funnel-events.js'
      - 'website/tct-tracking.js'
      - 'website/meet-gideon.html'
      - 'website/pilot/**'
      - 'website/onboarding/**'
      - 'tests/website-trial-funnel.test.js'
      - 'tests/website-buyer-consent-release.test.js'
      - 'tests/website-demo-audio.test.js'
      - '.github/workflows/website-trial-funnel.yml'

jobs:
  trial-funnel-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run trial funnel regression
        run: node --test tests/website-buyer-consent-release.test.js tests/website-trial-funnel.test.js tests/website-demo-audio.test.js

name: Lane 6 control cycle

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-legal-channel-release-gates.mjs
      - run: node scripts/test-lane6-data-governance.mjs
      - run: node scripts/test-paid-tracking-gate.mjs
      - run: node website/tests/legal-sms-consistency.test.js
      - run: node scripts/verify-live-lane6-controls.mjs

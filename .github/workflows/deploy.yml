name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify ntfy on deploy
        if: success()
        run: |
          CHANGED=$(git log -1 --pretty=format:"%s")
          curl -s \
            -H "Title: Site deployed" \
            -H "Priority: default" \
            -H "Tags: rocket" \
            -d "Deploy complete: ${CHANGED}" \
            https://ntfy.sh/tct-finishtask

      - name: Notify ntfy on failure
        if: failure()
        run: |
          curl -s \
            -H "Title: Deploy FAILED" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -d "GitHub Pages deploy failed. Check Actions tab." \
            https://ntfy.sh/tct-finishtask

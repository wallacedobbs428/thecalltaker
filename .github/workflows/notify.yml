name: Notify on push

on:
  push:
    branches: [main, 'claude/**']

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send ntfy notification
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          # Truncate commit message to first line, max 200 chars
          SUBJECT=$(echo "$COMMIT_MSG" | head -1 | cut -c1-200)

          # Send to URGENT topic (Wallace checks this)
          curl -sf \
            -H "Title: [MILLS] Push to ${BRANCH}" \
            -H "Priority: high" \
            -H "Tags: hammer_and_wrench" \
            -d "Commit: ${SUBJECT}" \
            https://ntfy.sh/tct-urgent-Hk9UOEZR || echo "WARN: ntfy urgent failed"

          # Send to finish-task topic (backup)
          curl -sf \
            -H "Title: Push to ${BRANCH}" \
            -H "Priority: default" \
            -H "Tags: white_check_mark" \
            -d "Commit: ${SUBJECT}" \
            https://ntfy.sh/tct-finishtask || echo "WARN: ntfy finishtask failed"

          echo "Notifications sent for: ${SUBJECT}"

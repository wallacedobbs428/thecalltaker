name: Hero Headline Regression

on:
  pull_request:
    paths:
      - 'website/index.html'
      - 'website/shared/**'
      - '.github/workflows/hero-regression.yml'
  push:
    branches: [main]
    paths:
      - 'website/index.html'
      - 'website/shared/**'
      - '.github/workflows/hero-regression.yml'

jobs:
  hero-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hero headline regression test
        run: python3 website/tests/hero-regression.py

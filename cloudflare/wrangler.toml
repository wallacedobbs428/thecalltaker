name = "tct-ghl-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# Route: thecalltaker.com/api/ghl/* (set in Cloudflare dashboard or via wrangler)
# routes = [
#   { pattern = "thecalltaker.com/api/ghl/*", zone_name = "thecalltaker.com" },
#   { pattern = "www.thecalltaker.com/api/ghl/*", zone_name = "thecalltaker.com" }
# ]

# KV namespace for rate limiting
# After running: wrangler kv:namespace create RATE_LIMIT
# Paste the returned id below
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "PASTE_KV_NAMESPACE_ID_HERE"

# Secrets (set via `wrangler secret put`):
# - GHL_API_KEY    → your GHL API key (pit-771d5b3f-...)
# - PROXY_SECRET   → a random token the frontend sends as Bearer auth

[observability]
enabled = true

name = "tct-ghl-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

# Routes: Worker intercepts /api/ghl/*, everything else → GitHub Pages
routes = [
  { pattern = "thecalltaker.com/api/ghl/*", zone_name = "thecalltaker.com" },
  { pattern = "www.thecalltaker.com/api/ghl/*", zone_name = "thecalltaker.com" }
]

# Rate limiting is in-memory (no KV needed at <10K req/day).
# If you scale past 10K req/day and need persistent rate limiting,
# uncomment and create a KV namespace:
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "YOUR_KV_NAMESPACE_ID"

# Secrets (set via `wrangler secret put`):
# - GHL_API_KEY    → your GHL API key (pit-771d5b3f-...)
# - PROXY_SECRET   → a random token the frontend sends as Bearer auth

[observability]
enabled = true

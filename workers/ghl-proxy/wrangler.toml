name = "tct-ghl-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"
account_id = ""  # Set via: wrangler whoami

# Route: all /api/ghl/* requests on thecalltaker.com
routes = [
  { pattern = "thecalltaker.com/api/ghl/*", zone_name = "thecalltaker.com" },
  { pattern = "www.thecalltaker.com/api/ghl/*", zone_name = "thecalltaker.com" },
]

# KV namespace for rate limiting
kv_namespaces = [
  { binding = "RATE_LIMIT", id = "" }  # Filled by deploy.sh after kv:namespace create
]

# Secrets (set via wrangler secret put):
# - GHL_API_KEY
# - PROXY_SECRET

[observability]
enabled = true

      <stop offset="0%" style="stop-color:#00C96B;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#00C96B;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background: black rounded square -->
  <rect width="512" height="512" rx="96" fill="#0a0a0a"/>

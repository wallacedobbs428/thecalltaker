<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Review Prompt — The Call Taker</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    body {
      min-height: 100vh;
      background: #080808;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.2);
      border-radius: 100px;
      padding: 6px 16px;
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 2s infinite;
    }

    .badge-text {
      color: #22c55e;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
    }

    h1 {
      color: #fff;
      font-size: 26px;
      font-weight: 800;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
      text-align: center;
    }

    .subtitle {
      color: #444;
      font-size: 13px;
      margin: 0 0 32px;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 680px;
      background: #0d0d0d;
      border: 1px solid #1c1c1c;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 40px 80px rgba(0,0,0,0.6);
    }

    .card-header {
      padding: 16px 22px;
      border-bottom: 1px solid #1c1c1c;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dots {
      display: flex;
      gap: 5px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .card-filename {
      color: #333;
      font-size: 11px;
      font-family: monospace;
    }

    .card-tokens {
      color: #2a2a2a;
      font-size: 11px;
    }

    .prompt-preview {
      padding: 22px;
      max-height: 320px;
      overflow-y: auto;
      color: #444;
      font-size: 12px;
      line-height: 1.9;
      white-space: pre-wrap;
      font-family: monospace;
    }

    .prompt-preview::-webkit-scrollbar {
      width: 4px;
    }
    .prompt-preview::-webkit-scrollbar-track {
      background: transparent;
    }
    .prompt-preview::-webkit-scrollbar-thumb {
      background: #222;
      border-radius: 2px;
    }

    .tags-bar {
      padding: 16px 22px;
      border-top: 1px solid #1c1c1c;
      border-bottom: 1px solid #1c1c1c;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 4px 10px;
      color: #555;
      font-size: 11px;
      font-family: monospace;
    }

    .copy-wrap {
      padding: 18px 22px;
    }

    .copy-btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: #000;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .copy-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .copy-btn.copied {
      background: rgba(34,197,94,0.1);
      color: #22c55e;
      border: 1px solid rgba(34,197,94,0.3);
    }

    .footer-text {
      color: #1e1e1e;
      font-size: 11px;
      margin-top: 20px;
      letter-spacing: 0.05em;
    }
  </style>
  <script src="tct-tracking.js" defer></script>
<!-- Meta Pixel Code -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?

n.queue=[];t=b.createElement(e);t.async=!0;

</head>
<body>
  <!-- Badge -->
  <div class="badge">
    <div class="badge-dot"></div>
    <span class="badge-text">OPEN IN NEW CLAUDE CODE WINDOW</span>
  </div>

  <h1>Business Review Prompt</h1>
  <p class="subtitle">Audits the entire business &rarr; returns 3 next best moves ranked by speed to revenue</p>

  <!-- Card -->
  <div class="card">
    <!-- Card header -->
    <div class="card-header">
      <div class="card-header-left">
        <div class="dots">
          <div class="dot" style="background:#ff5f57"></div>
          <div class="dot" style="background:#febc2e"></div>
          <div class="dot" style="background:#28c840"></div>
        </div>
        <span class="card-filename">new_claude_code_window.md</span>
      </div>
      <span class="card-tokens">~850 tokens</span>
    </div>

    <!-- Prompt preview -->
    <div class="prompt-preview" id="promptPreview"></div>

    <!-- Tags -->
    <div class="tags-bar">
      <div class="tag">Audits live site</div>
      <div class="tag">Reads GitHub repo</div>
      <div class="tag">Finds blockers first</div>
      <div class="tag">Returns 3 exact moves</div>
      <div class="tag">Ranked by speed to $</div>
    </div>

    <!-- Copy button -->
    <div class="copy-wrap">
      <button class="copy-btn" id="copyBtn" onclick="handleCopy()">
        &#8984;  COPY PROMPT
      </button>
    </div>
  </div>

  <p class="footer-text">THE CALL TAKER &copy; 2026</p>

  <script>
    var prompt = "You are a senior growth engineer and business strategist reviewing The Call Taker \u2014 a national AI receptionist service built and operated by a 16-year-old solo founder. Your job is to audit everything, think deeply, and return exactly 3 next moves ranked by highest business impact.\n\n**WHO YOU ARE WORKING WITH**\n- Founder: Wallace, 16, Nashville. Handles all strategy, sales, marketing, and technical development himself.\n- Business partner: Mills (GitHub: msnfjsfsfgskgvfyvsyfv) \u2014 technical collaborator\n- Current MRR: $0. Hot leads: 35. Demos booked: 0. The gap between interest and revenue is the #1 problem.\n\n**WHAT HAS BEEN BUILT**\nCodebase & Infrastructure:\n- 93 HTML pages live on GitHub Pages (wallacedobbs428/thecalltaker)\n- 13 industry verticals, 39 SEO blog posts, 6 case studies, pilot page, try-funnel\n- Homepage: green/black/Inter design, strong copy, text-only hero (no image yet)\n- 37 industry + blog pages still have old blue/red design \u2014 not yet updated\n- Voice agent: GHL built-in, demo line (615) 784-5747, character \"Gideon\"\n- Pricing: $97/mo after-hours, $497/mo 24/7, $497/mo premium\n\nOutreach Stack:\n- 30 launchd services running on MacBook\n- Lead finders scraping 60+ leads/day across verticals (800+ per week)\n- Water damage blast: 50/day, 221 sent\n- Multi-vertical blast: 100/day, 200 sent \u2014 63% failure rate, 1,325 failed\n- Bland.ai cold caller: dead since Feb 24\n- Storm chaser: detects storms but sends 0 emails\n- n8n: speed-to-lead checks every minute\n- GHL CRM: 4,787 contacts, 386 tags, 17 custom fields\n\nCRM State:\n- 35 hot leads sitting with 0 follow-up sequence active\n- 0 demos booked\n- 0 paying customers\n- Stripe connected but never charged anyone\n\nRecent Builds Completed:\n- Apple/Tesla-level iPhone product image (floating phone, green waveform, \"Every call answered. Every lead captured.\")\n- HVAC lifestyle image (contractor holding phone showing booked lead)\n- Homepage hero split layout prompt written \u2014 not yet implemented\n- Contributor tracking system prompt written \u2014 not yet implemented\n- HVAC image added to email/SMS/DM outreach prompt written \u2014 not yet implemented\n\n**YOUR AUDIT PROCESS**\n1. Read the live site at https://thecalltaker.com\n2. Read the HVAC industry page at https://thecalltaker.com/industries/hvac.html\n3. Read the pilot page at https://thecalltaker.com/pilot/\n4. Look at the GitHub repo wallacedobbs428/thecalltaker if accessible\n5. Consider the full business context above\n\n**WHAT TO RETURN**\nReturn exactly this format \u2014 nothing else:\n\n---\nMOVE 1: [NAME]\nWHY: [2-3 sentences on why this is the highest impact move right now]\nWHAT TO DO: [Exact step-by-step execution plan \u2014 specific enough to hand to a developer and ship today]\nEXPECTED OUTCOME: [What changes in the business when this is done]\nTIME TO EXECUTE: [Honest estimate]\n\nMOVE 2: [NAME]\nWHY: [2-3 sentences]\nWHAT TO DO: [Exact execution plan]\nEXPECTED OUTCOME: [Business impact]\nTIME TO EXECUTE: [Honest estimate]\n\nMOVE 3: [NAME]\nWHY: [2-3 sentences]\nWHAT TO DO: [Exact execution plan]\nEXPECTED OUTCOME: [Business impact]\nTIME TO EXECUTE: [Honest estimate]\n---\n\n**RULES**\n- Rank strictly by speed to first dollar \u2014 the business has $0 MRR and 35 hot leads right now\n- Do not suggest things already built or in progress\n- Do not suggest hiring, funding, or slowing down\n- Be brutally specific \u2014 no vague advice like \"improve your outreach\"\n- If you identify a critical blocker that overrides the top 3, call it out first as a BLOCKER before listing the moves\n- Think like a founder who needs revenue this week, not next quarter";

    document.getElementById('promptPreview').textContent = prompt;

    function handleCopy() {
      var btn = document.getElementById('copyBtn');
      navigator.clipboard.writeText(prompt).then(function() {
        btn.classList.add('copied');
        btn.innerHTML = '\u2713 COPIED \u2014 OPEN NEW WINDOW & PASTE';
        setTimeout(function() {
          btn.classList.remove('copied');
          btn.innerHTML = '\u2318  COPY PROMPT';
        }, 2000);
      });
    }
  </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00C96B"/>
      <stop offset="100%" style="stop-color:#00E676"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00C96B;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#00C96B;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
  </g>

  <!-- Green glow top-center -->
  <ellipse cx="600" cy="0" rx="400" ry="200" fill="url(#glow)"/>

  <!-- Phone icon with signal waves — left side -->
  <g transform="translate(140,195)">
    <!-- Phone handset -->
    <g transform="scale(4.5)">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"
        fill="none" stroke="#00C96B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Signal waves -->
    <g fill="none" stroke="#00C96B" stroke-linecap="round" stroke-width="3.5">
      <path d="M 115 22 A 30 30 0 0 1 115 52" opacity="0.9"/>
      <path d="M 128 12 A 45 45 0 0 1 128 62" opacity="0.5"/>
      <path d="M 141 2 A 60 60 0 0 1 141 72" opacity="0.25"/>
    </g>
  </g>

  <!-- Brand name -->
  <text x="370" y="265" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-2.5">The Call Taker</text>

  <!-- Green underline beneath brand name -->
  <rect x="370" y="280" width="120" height="4" rx="2" fill="#00C96B"/>

  <!-- Tagline -->
  <text x="370" y="340" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="28" font-weight="500" fill="#ffffff" opacity="0.7">AI Receptionist for Service Businesses</text>

  <!-- Stats bar — bottom -->
  <rect x="0" y="470" width="1200" height="1" fill="#222222"/>

  <!-- 3 stat columns -->
  <g font-family="Inter, -apple-system, system-ui, sans-serif" text-anchor="middle">
    <!-- Stat 1 -->
    <text x="250" y="520" font-size="36" font-weight="800" fill="#00C96B">24/7</text>
    <text x="250" y="550" font-size="14" font-weight="500" fill="#666666" letter-spacing="2">LIVE AI COVERAGE</text>

    <!-- Stat 2 -->
    <text x="600" y="520" font-size="36" font-weight="800" fill="#00C96B">0%</text>
    <text x="600" y="550" font-size="14" font-weight="500" fill="#666666" letter-spacing="2">MISSED CALLS</text>

    <!-- Stat 3 -->
    <text x="950" y="520" font-size="36" font-weight="800" fill="#00C96B">$97</text>
    <text x="950" y="550" font-size="14" font-weight="500" fill="#666666" letter-spacing="2">PER MONTH</text>
  </g>

  <!-- Dividers between stats -->
  <line x1="425" y1="500" x2="425" y2="560" stroke="#222222" stroke-width="1"/>
  <line x1="775" y1="500" x2="775" y2="560" stroke="#222222" stroke-width="1"/>

  <!-- Bottom accent line -->
  <rect x="0" y="627" width="1200" height="3" fill="url(#accent)"/>

  <!-- URL bottom right -->
  <text x="1160" y="605" text-anchor="end" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="14" font-weight="500" fill="#444444">thecalltaker.com</text>
</svg>

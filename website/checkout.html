<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>The Call Taker - Setup Review</title>
<script>
  (function () {
    var allowed = {
      afterhours: 'afterhours',
      full247: 'full247',
      starter: 'full247',
      premium: 'premium',
      pro: 'premium'
    };
    var plan = new URLSearchParams(window.location.search).get('plan');
    var safePlan = allowed[plan] || 'full247';
    window.location.replace('/signup.html?plan=' + safePlan + '&source=checkout-hold');
  })();
</script>
</head>
<body>
<p>Taking you to setup review. <a href="/pricing.html">Choose a plan</a>.</p>
</body>
</html>

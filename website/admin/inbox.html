<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Inbox — Admin — The Call Taker</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    /* Inbox-specific overrides */
    .inbox-search {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .inbox-search input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: .85rem;
      font-family: inherit;
      color: var(--text);
      background: var(--white);
      transition: border-color .15s;
    }
    .inbox-search input:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(234,88,12,.1);
    }
    .inbox-search-wrap {
      position: relative;
    }
    .inbox-search-wrap svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .inbox-list-header {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .inbox-thread-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--navy-dark);
    }
    .inbox-thread-badges {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .inbox-thread-link {
      font-size: .8rem;
      color: var(--orange);
      font-weight: 600;
      text-decoration: none;
    }
    .inbox-thread-link:hover {
      text-decoration: underline;
    }
    .inbox-empty-thread {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 12px;
      padding: 40px;
    }
    .inbox-empty-thread svg {
      opacity: .35;
    }
    .inbox-empty-thread p {
      font-size: .9rem;
    }
    .inbox-compose-bar {
      padding: 12px 20px 16px;
      border-top: 1px solid var(--border);
      background: var(--off-white);
    }
    .inbox-compose-subject {
      margin-bottom: 8px;
    }
    .inbox-compose-subject input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: .85rem;
      font-family: inherit;
      color: var(--text);
    }
    .inbox-compose-subject input:focus {
      outline: none;
      border-color: var(--orange);
    }
    .inbox-compose-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .inbox-compose-row textarea {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-family: inherit;
      font-size: .875rem;
      min-height: 44px;
      max-height: 120px;
      color: var(--text);
    }
    .inbox-compose-row textarea:focus {
      outline: none;
      border-color: var(--orange);
    }
    .inbox-compose-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: stretch;
    }
    .inbox-type-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .inbox-type-btn {
      flex: 1;
      padding: 5px 12px;
      font-size: .75rem;
      font-weight: 600;
      font-family: inherit;
      border: none;
      cursor: pointer;
      background: var(--white);
      color: var(--text-muted);
      transition: all .15s;
      text-align: center;
    }
    .inbox-type-btn.active {
      background: var(--orange);
      color: var(--white);
    }
    .inbox-msg-body {
      white-space: pre-wrap;
      word-break: break-word;
    }
    .inbox-msg-body a {
      color: inherit;
      text-decoration: underline;
    }
    .inbox-list-item .inbox-list-type {
      display: inline-block;
      font-size: .65rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 1px 5px;
      border-radius: 3px;
      margin-left: 4px;
      vertical-align: middle;
    }
    .inbox-list-type.sms {
      background: var(--green-light);
      color: var(--green);
    }
    .inbox-list-type.email {
      background: var(--blue-light);
      color: var(--blue);
    }
    .inbox-loading-center {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      width: 100%;
    }

    /* Compose modal extras */
    .compose-contact-search {
      position: relative;
    }
    .compose-contact-results {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--white);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      max-height: 200px;
      overflow-y: auto;
      z-index: 10;
      box-shadow: var(--shadow);
      display: none;
    }
    .compose-contact-results.open {
      display: block;
    }
    .compose-contact-item {
      padding: 10px 14px;
      cursor: pointer;
      font-size: .875rem;
      border-bottom: 1px solid var(--light);
      transition: background .1s;
    }
    .compose-contact-item:hover {
      background: var(--off-white);
    }
    .compose-contact-item:last-child {
      border-bottom: none;
    }
    .compose-contact-name {
      font-weight: 600;
      color: var(--navy-dark);
    }
    .compose-contact-detail {
      font-size: .75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .compose-selected-contact {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--off-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 12px;
    }
    .compose-selected-name {
      font-weight: 600;
      font-size: .875rem;
      color: var(--navy-dark);
      flex: 1;
    }
    .compose-selected-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 2px;
      display: flex;
      align-items: center;
    }
    .compose-selected-remove:hover {
      color: var(--red);
    }
    .compose-type-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .compose-type-label {
      font-size: .8rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .inline-error {
      background: var(--red-light);
      color: var(--red);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: .85rem;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="admin-layout">

    <!-- Mobile toggle -->
    <button id="admin-mobile-toggle"><span></span><span></span><span></span></button>

    <!-- Sidebar (injected by admin-nav.js) -->
    <aside id="admin-sidebar"></aside>

    <!-- Main Content -->
    <main class="admin-main">

      <!-- Top Bar -->
      <div class="admin-topbar">
        <h1>Inbox</h1>
        <div class="admin-topbar-actions">
          <button class="admin-btn btn-primary" onclick="openComposeModal()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Compose
          </button>
        </div>
      </div>

      <!-- Inbox Layout -->
      <div class="inbox-layout" id="inboxLayout">

        <!-- Left: Contact/Conversation List -->
        <div class="inbox-list" id="inboxList">
          <div class="inbox-search">
            <div class="inbox-search-wrap">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="contactSearch" placeholder="Search contacts..." autocomplete="off">
            </div>
          </div>
          <div id="contactListInner">
            <div class="inbox-loading-center" id="listLoading">
              <div class="admin-spinner admin-spinner-lg"></div>
            </div>
          </div>
        </div>

        <!-- Right: Thread View -->
        <div class="inbox-thread" id="inboxThread">
          <div class="inbox-empty-thread" id="emptyThread">
            <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <p>Select a contact to view their conversation</p>
          </div>
          <div id="threadContent" class="hidden" style="display:none;flex-direction:column;height:100%;">
            <!-- Thread Header -->
            <div class="inbox-thread-header" id="threadHeader">
              <div>
                <span class="inbox-thread-name" id="threadName"></span>
                <div class="inbox-thread-badges" id="threadBadges"></div>
              </div>
              <a href="#" class="inbox-thread-link" id="threadContactLink">View Contact</a>
            </div>
            <!-- Messages -->
            <div class="inbox-messages" id="threadMessages">
              <div class="inbox-loading-center" id="messagesLoading" style="display:none;">
                <div class="admin-spinner admin-spinner-lg"></div>
              </div>
            </div>
            <!-- Compose Bar -->
            <div class="inbox-compose-bar" id="composeBar">
              <div class="inbox-compose-subject" id="composeSubjectWrap" style="display:none;">
                <input type="text" id="composeSubject" placeholder="Email subject...">
              </div>
              <div class="inbox-compose-row">
                <textarea id="composeMessage" placeholder="Type a message..." rows="1"></textarea>
                <div class="inbox-compose-actions">
                  <div class="inbox-type-toggle">
                    <button class="inbox-type-btn active" id="typeSMS" onclick="setReplyType('SMS')">SMS</button>
                    <button class="inbox-type-btn" id="typeEmail" onclick="setReplyType('Email')">Email</button>
                  </div>
                  <button class="admin-btn btn-primary btn-sm" id="sendBtn" onclick="sendReply()">
                    Send
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Compose Modal -->
  <div class="admin-modal-overlay" id="composeModal">
    <div class="admin-modal" style="max-width:520px;">
      <div class="admin-modal-header">
        <h3 class="admin-modal-title">New Message</h3>
        <button class="admin-modal-close" onclick="closeComposeModal()">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div id="composeError" class="inline-error" style="display:none;"></div>

      <!-- Contact Search -->
      <div class="admin-form-group">
        <label class="admin-label">To</label>
        <div id="composeSelectedWrap" style="display:none;">
          <div class="compose-selected-contact">
            <span class="compose-selected-name" id="composeSelectedName"></span>
            <button class="compose-selected-remove" onclick="clearComposeContact()">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
        <div class="compose-contact-search" id="composeSearchWrap">
          <input type="text" class="admin-input" id="composeContactSearch" placeholder="Search by name, email, or phone..." autocomplete="off">
          <div class="compose-contact-results" id="composeContactResults"></div>
        </div>
      </div>

      <!-- Type Selector -->
      <div class="compose-type-row">
        <span class="compose-type-label">Send via:</span>
        <div class="inbox-type-toggle">
          <button class="inbox-type-btn active" id="composeTypeSMS" onclick="setComposeType('SMS')">SMS</button>
          <button class="inbox-type-btn" id="composeTypeEmail" onclick="setComposeType('Email')">Email</button>
        </div>
      </div>

      <!-- Subject (Email only) -->
      <div class="admin-form-group" id="composeModalSubjectWrap" style="display:none;">
        <label class="admin-label">Subject</label>
        <input type="text" class="admin-input" id="composeModalSubject" placeholder="Email subject">
      </div>

      <!-- Message -->
      <div class="admin-form-group">
        <label class="admin-label">Message</label>
        <textarea class="admin-textarea" id="composeModalMessage" rows="5" placeholder="Type your message..."></textarea>
      </div>

      <div class="admin-modal-footer">
        <button class="admin-btn btn-secondary" onclick="closeComposeModal()">Cancel</button>
        <button class="admin-btn btn-primary" id="composeSendBtn" onclick="sendComposeMessage()">
          Send Message
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="admin-toast" id="toast"></div>

  <!-- Scripts -->
  <script src="js/admin-auth.js"></script>
  <script src="js/ghl-api.js"></script>
  <script src="js/admin-nav.js"></script>

  <script>
    // ── Auth Gate ──
    AdminAuth.requireAuth();

    // ── State ──
    var state = {
      contacts: [],
      activeContactId: null,
      activeConversationId: null,
      activeContact: null,
      replyType: 'SMS',
      composeType: 'SMS',
      composeContactId: null,
      composeContact: null,
      searchTimeout: null,
      composeSearchTimeout: null,
      sending: false
    };

    // ── Init ──
    document.addEventListener('DOMContentLoaded', async function() {
      await loadContacts();
      checkUrlParams();
      setupSearchListeners();
      setupTextareaAutoResize();
    });

    // ── Load Contacts ──
    async function loadContacts(query) {
      var listInner = document.getElementById('contactListInner');
      var loading = document.getElementById('listLoading');
      loading.style.display = 'flex';

      try {
        var data = await GHL.listContacts({ limit: 50, query: query || '', noCache: !!query });
        state.contacts = (data.contacts || []).sort(function(a, b) {
          var da = new Date(a.dateUpdated || a.dateAdded || 0).getTime();
          var db = new Date(b.dateUpdated || b.dateAdded || 0).getTime();
          return db - da;
        });
        renderContactList();
      } catch (err) {
        listInner.innerHTML = '<div class="admin-empty"><p>Failed to load contacts</p><p class="text-sm text-muted">' + escapeHtml(err.message) + '</p></div>';
      }
    }

    // ── Render Contact List ──
    function renderContactList() {
      var listInner = document.getElementById('contactListInner');
      if (state.contacts.length === 0) {
        listInner.innerHTML = '<div class="admin-empty"><p>No contacts found</p></div>';
        return;
      }

      var html = '';
      state.contacts.forEach(function(c) {
        var name = contactName(c);
        var preview = c.lastMessageBody || c.email || GHL.formatPhone(c.phone) || 'No messages yet';
        if (preview.length > 60) preview = preview.substring(0, 60) + '...';
        var time = c.dateUpdated ? GHL.timeAgo(c.dateUpdated) : '';
        var isActive = state.activeContactId === c.id;

        html += '<div class="inbox-list-item' + (isActive ? ' active' : '') + '" data-id="' + c.id + '" onclick="selectContact(\'' + c.id + '\')">';
        html += '<div class="flex-between" style="margin-bottom:2px;">';
        html += '<span class="inbox-list-name">' + escapeHtml(name) + '</span>';
        html += '<span class="inbox-list-time">' + escapeHtml(time) + '</span>';
        html += '</div>';
        html += '<div class="inbox-list-preview">' + escapeHtml(preview) + '</div>';
        html += '</div>';
      });

      listInner.innerHTML = html;
    }

    // ── Select Contact ──
    async function selectContact(contactId) {
      state.activeContactId = contactId;
      renderContactList();

      var emptyThread = document.getElementById('emptyThread');
      var threadContent = document.getElementById('threadContent');
      emptyThread.style.display = 'none';
      threadContent.style.display = 'flex';
      threadContent.classList.remove('hidden');

      var messagesEl = document.getElementById('threadMessages');
      var loadingEl = document.getElementById('messagesLoading');
      messagesEl.innerHTML = '';
      loadingEl.style.display = 'flex';
      messagesEl.appendChild(loadingEl);

      try {
        // Load contact details
        var contactData = await GHL.getContact(contactId);
        state.activeContact = contactData.contact;
        var name = contactName(state.activeContact);

        // Update header
        document.getElementById('threadName').textContent = name;
        document.getElementById('threadContactLink').href = 'contacts.html?id=' + contactId;

        var badgesHtml = '';
        if (state.activeContact.phone) {
          badgesHtml += '<span class="admin-badge badge-green" style="font-size:.65rem;">SMS</span>';
        }
        if (state.activeContact.email) {
          badgesHtml += '<span class="admin-badge badge-blue" style="font-size:.65rem;">Email</span>';
        }
        document.getElementById('threadBadges').innerHTML = badgesHtml;

        // Auto-select reply type based on available channels
        if (state.activeContact.phone) {
          setReplyType('SMS');
        } else if (state.activeContact.email) {
          setReplyType('Email');
        }

        // Search for conversations
        var convData = await GHL.searchConversations(contactId);
        var conversations = convData.conversations || [];

        if (conversations.length === 0) {
          loadingEl.style.display = 'none';
          messagesEl.innerHTML = '<div class="admin-empty" style="padding:40px;"><p>No conversation history</p><p class="text-sm text-muted">Send a message to start the conversation</p></div>';
          return;
        }

        // Use first conversation
        state.activeConversationId = conversations[0].id;

        // Load messages
        var msgData = await GHL.getMessages(state.activeConversationId);
        var messages = msgData.messages;
        // GHL sometimes returns messages as non-array — normalize
        if (!Array.isArray(messages)) messages = messages ? [messages] : [];
        // Filter out non-object entries (GHL can return strings)
        messages = messages.filter(function(m) { return m && typeof m === 'object'; });
        loadingEl.style.display = 'none';

        if (messages.length === 0) {
          messagesEl.innerHTML = '<div class="admin-empty" style="padding:40px;"><p>No messages yet</p><p class="text-sm text-muted">Send a message to start the conversation</p></div>';
          return;
        }

        renderMessages(messages);

      } catch (err) {
        loadingEl.style.display = 'none';
        messagesEl.innerHTML = '<div class="admin-empty"><p>Error loading conversation</p><p class="text-sm text-muted">' + escapeHtml(err.message) + '</p></div>';
      }
    }

    // ── Render Messages ──
    function renderMessages(messages) {
      var messagesEl = document.getElementById('threadMessages');
      messagesEl.innerHTML = '';

      // Sort oldest first
      messages.sort(function(a, b) {
        return new Date(a.dateAdded).getTime() - new Date(b.dateAdded).getTime();
      });

      messages.forEach(function(msg) {
        if (!msg || typeof msg !== 'object') return;

        var direction = msg.direction === 'inbound' ? 'inbound' : 'outbound';
        var body = msg.body || msg.message || msg.html || '';
        var msgType = (msg.messageType || msg.type || 'SMS').toUpperCase();
        if (msgType === 'TYPE_SMS' || msgType === 'SMS') msgType = 'SMS';
        if (msgType === 'TYPE_EMAIL' || msgType === 'EMAIL') msgType = 'Email';
        var time = GHL.formatDateTime(msg.dateAdded);

        // Strip HTML tags from email bodies for display
        var displayBody = body;
        if (msgType === 'Email' && body.indexOf('<') !== -1) {
          var tmp = document.createElement('div');
          tmp.innerHTML = body;
          displayBody = tmp.textContent || tmp.innerText || body;
        }
        if (!displayBody.trim()) return;

        var div = document.createElement('div');
        div.className = 'inbox-msg ' + direction;
        div.innerHTML = '<div class="inbox-msg-body">' + escapeHtml(displayBody) + '</div>' +
          '<div class="inbox-msg-meta">' + escapeHtml(msgType) + ' &middot; ' + escapeHtml(time) + '</div>';
        messagesEl.appendChild(div);
      });

      // Auto-scroll to bottom
      requestAnimationFrame(function() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    }

    // ── Reply Type Toggle (Thread) ──
    function setReplyType(type) {
      state.replyType = type;
      document.getElementById('typeSMS').classList.toggle('active', type === 'SMS');
      document.getElementById('typeEmail').classList.toggle('active', type === 'Email');
      document.getElementById('composeSubjectWrap').style.display = type === 'Email' ? 'block' : 'none';
    }

    // ── Send Reply ──
    async function sendReply() {
      if (state.sending) return;
      var message = document.getElementById('composeMessage').value.trim();
      if (!message) return;
      if (!state.activeContactId) return;

      var sendBtn = document.getElementById('sendBtn');
      state.sending = true;
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';

      try {
        var opts = {
          type: state.replyType,
          contactId: state.activeContactId
        };

        if (state.replyType === 'Email') {
          opts.html = '<p>' + escapeHtml(message).replace(/\n/g, '<br>') + '</p>';
          opts.subject = document.getElementById('composeSubject').value.trim() || '(No Subject)';
        } else {
          opts.message = message;
        }

        await GHL.sendMessage(opts);

        // Append to thread
        var messagesEl = document.getElementById('threadMessages');
        var emptyMsg = messagesEl.querySelector('.admin-empty');
        if (emptyMsg) emptyMsg.remove();

        var div = document.createElement('div');
        div.className = 'inbox-msg outbound';
        div.innerHTML = '<div class="inbox-msg-body">' + escapeHtml(message) + '</div>' +
          '<div class="inbox-msg-meta">' + state.replyType + ' &middot; just now</div>';
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        // Clear fields
        document.getElementById('composeMessage').value = '';
        document.getElementById('composeSubject').value = '';
        document.getElementById('composeSubjectWrap').style.display = state.replyType === 'Email' ? 'block' : 'none';

        showToast('Message sent', 'success');

      } catch (err) {
        showToast('Failed to send: ' + err.message, 'error');
      } finally {
        state.sending = false;
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send';
      }
    }

    // ── Compose Modal ──
    function openComposeModal() {
      document.getElementById('composeModal').classList.add('open');
      document.getElementById('composeError').style.display = 'none';
      document.getElementById('composeContactSearch').value = '';
      document.getElementById('composeModalSubject').value = '';
      document.getElementById('composeModalMessage').value = '';
      clearComposeContact();
      setComposeType('SMS');
      setTimeout(function() {
        document.getElementById('composeContactSearch').focus();
      }, 200);
    }

    function closeComposeModal() {
      document.getElementById('composeModal').classList.remove('open');
    }

    function setComposeType(type) {
      state.composeType = type;
      document.getElementById('composeTypeSMS').classList.toggle('active', type === 'SMS');
      document.getElementById('composeTypeEmail').classList.toggle('active', type === 'Email');
      document.getElementById('composeModalSubjectWrap').style.display = type === 'Email' ? 'block' : 'none';
    }

    // ── Compose Contact Search ──
    function setupSearchListeners() {
      // Main contact list search
      var searchInput = document.getElementById('contactSearch');
      searchInput.addEventListener('input', function() {
        clearTimeout(state.searchTimeout);
        var q = searchInput.value.trim();
        state.searchTimeout = setTimeout(function() {
          loadContacts(q);
        }, 400);
      });

      // Compose modal contact search
      var composeSearch = document.getElementById('composeContactSearch');
      composeSearch.addEventListener('input', function() {
        clearTimeout(state.composeSearchTimeout);
        var q = composeSearch.value.trim();
        if (q.length < 2) {
          document.getElementById('composeContactResults').classList.remove('open');
          return;
        }
        state.composeSearchTimeout = setTimeout(function() {
          searchComposeContacts(q);
        }, 400);
      });

      composeSearch.addEventListener('focus', function() {
        if (composeSearch.value.trim().length >= 2) {
          document.getElementById('composeContactResults').classList.add('open');
        }
      });

      // Close results on outside click
      document.addEventListener('click', function(e) {
        var wrap = document.getElementById('composeSearchWrap');
        if (!wrap.contains(e.target)) {
          document.getElementById('composeContactResults').classList.remove('open');
        }
      });

      // Close modal on overlay click
      document.getElementById('composeModal').addEventListener('click', function(e) {
        if (e.target === this) closeComposeModal();
      });

      // Enter key to send in compose bar
      document.getElementById('composeMessage').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendReply();
        }
      });
    }

    async function searchComposeContacts(query) {
      var resultsEl = document.getElementById('composeContactResults');
      resultsEl.innerHTML = '<div style="padding:10px 14px;color:var(--text-muted);font-size:.85rem;">Searching...</div>';
      resultsEl.classList.add('open');

      try {
        var data = await GHL.listContacts({ limit: 15, query: query, noCache: true });
        var contacts = data.contacts || [];
        if (contacts.length === 0) {
          resultsEl.innerHTML = '<div style="padding:10px 14px;color:var(--text-muted);font-size:.85rem;">No contacts found</div>';
          return;
        }

        var html = '';
        contacts.forEach(function(c) {
          var name = contactName(c);
          var detail = c.email || GHL.formatPhone(c.phone) || '';
          html += '<div class="compose-contact-item" onclick="selectComposeContact(\'' + c.id + '\', \'' + escapeAttr(name) + '\', \'' + escapeAttr(c.email || '') + '\', \'' + escapeAttr(c.phone || '') + '\')">';
          html += '<div class="compose-contact-name">' + escapeHtml(name) + '</div>';
          if (detail) html += '<div class="compose-contact-detail">' + escapeHtml(detail) + '</div>';
          html += '</div>';
        });
        resultsEl.innerHTML = html;

      } catch (err) {
        resultsEl.innerHTML = '<div style="padding:10px 14px;color:var(--red);font-size:.85rem;">Search failed</div>';
      }
    }

    function selectComposeContact(id, name, email, phone) {
      state.composeContactId = id;
      state.composeContact = { id: id, name: name, email: email, phone: phone };

      document.getElementById('composeSelectedName').textContent = name;
      document.getElementById('composeSelectedWrap').style.display = 'block';
      document.getElementById('composeSearchWrap').style.display = 'none';
      document.getElementById('composeContactResults').classList.remove('open');

      // Auto-select type based on available channels
      if (phone) {
        setComposeType('SMS');
      } else if (email) {
        setComposeType('Email');
      }
    }

    function clearComposeContact() {
      state.composeContactId = null;
      state.composeContact = null;
      document.getElementById('composeSelectedWrap').style.display = 'none';
      document.getElementById('composeSearchWrap').style.display = 'block';
      document.getElementById('composeContactSearch').value = '';
      document.getElementById('composeContactResults').classList.remove('open');
    }

    // ── Send Compose Message ──
    async function sendComposeMessage() {
      var errorEl = document.getElementById('composeError');
      errorEl.style.display = 'none';

      if (!state.composeContactId) {
        errorEl.textContent = 'Please select a contact.';
        errorEl.style.display = 'block';
        return;
      }

      var message = document.getElementById('composeModalMessage').value.trim();
      if (!message) {
        errorEl.textContent = 'Please enter a message.';
        errorEl.style.display = 'block';
        return;
      }

      var sendBtn = document.getElementById('composeSendBtn');
      sendBtn.disabled = true;
      sendBtn.textContent = 'Sending...';

      try {
        var opts = {
          type: state.composeType,
          contactId: state.composeContactId
        };

        if (state.composeType === 'Email') {
          opts.html = '<p>' + escapeHtml(message).replace(/\n/g, '<br>') + '</p>';
          opts.subject = document.getElementById('composeModalSubject').value.trim() || '(No Subject)';
        } else {
          opts.message = message;
        }

        await GHL.sendMessage(opts);

        closeComposeModal();
        showToast('Message sent', 'success');

        // Refresh list and select the contact we just messaged
        await loadContacts();
        selectContact(state.composeContactId);

      } catch (err) {
        errorEl.textContent = 'Failed to send: ' + err.message;
        errorEl.style.display = 'block';
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send Message';
      }
    }

    // ── URL Parameter Support ──
    function checkUrlParams() {
      var params = new URLSearchParams(window.location.search);
      var contactId = params.get('contact');
      if (contactId) {
        selectContact(contactId);
      }
    }

    // ── Textarea Auto-Resize ──
    function setupTextareaAutoResize() {
      var textarea = document.getElementById('composeMessage');
      textarea.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 120) + 'px';
      });
    }

    // ── Helpers ──
    function contactName(c) {
      if (!c) return 'Unknown';
      var first = c.firstName || c.first_name || '';
      var last = c.lastName || c.last_name || '';
      var name = (first + ' ' + last).trim();
      return name || c.email || GHL.formatPhone(c.phone) || 'Unknown';
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function escapeAttr(str) {
      if (!str) return '';
      return String(str)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"');
    }

    function showToast(message, type) {
      var toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'admin-toast' + (type ? ' ' + type : '');
      toast.classList.add('show');
      setTimeout(function() {
        toast.classList.remove('show');
      }, 3000);
    }
  </script>
</body>
</html>

<body data-app="admin">

<div class="admin-layout">
  <div id="admin-sidebar"></div>

  <button id="admin-mobile-toggle">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <main class="admin-main">
    <!-- Top Bar -->
    <div class="admin-topbar">
      <h1>Intake Submissions</h1>
      <div class="admin-topbar-actions">
        <a href="../onboarding/intake.html" target="_blank" class="admin-btn btn-secondary btn-sm">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          View Intake Form
        </a>
      </div>
    </div>

    <!-- Info Banner -->
    <div class="admin-card mb-24" style="background: var(--blue-light); border-color: rgba(0,220,130,.2);">
      <div class="flex gap-12" style="align-items: flex-start;">
        <svg width="20" height="20" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" style="flex-shrink:0; margin-top:2px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        <p style="font-size:.875rem; color:var(--blue); line-height:1.5; margin:0;">
          Intake form submissions appear here when clients complete the onboarding form. Each submission creates a contact tagged with <strong>intake-submitted</strong>.
        </p>
      </div>
    </div>

    <!-- Submissions Table -->
    <div class="admin-card">
      <div class="admin-card-header">
        <h2 class="admin-card-title">Submissions</h2>
        <span class="text-sm text-muted" id="submission-count"></span>
      </div>
      <div id="intake-content">
        <div class="admin-loading">
          <span class="admin-spinner admin-spinner-lg"></span>
          <span>Loading intake submissions...</span>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Toast -->
<div id="toast-container"></div>

<!-- Shared JS -->
<script src="js/admin-auth.js"></script>
<script src="js/ghl-api.js"></script>
<script src="js/admin-nav.js"></script>

<script>
(function() {
  'use strict';

  // Auth gate
  AdminAuth.requireAuth();

  var INDUSTRY_TAGS = ['hvac', 'roofing', 'plumbing', 'electrical', 'dental', 'medspa', 'legal',
    'property-management', 'veterinary', 'locksmith', 'garage-door', 'towing', 'funeral', 'restoration', 'water-damage'];

  // === TOAST ===
  window.showToast = function(msg, type) {
    var container = document.getElementById('toast-container');
    var toast = document.createElement('div');
    toast.className = 'admin-toast' + (type ? ' ' + type : '');
    toast.textContent = msg;
    container.appendChild(toast);
    toast.offsetHeight;
    toast.classList.add('show');
    setTimeout(function() {
      toast.classList.remove('show');
      setTimeout(function() { toast.remove(); }, 300);
    }, 3500);
  };

  // === LOAD DATA ===
  async function loadIntakeSubmissions() {
    var container = document.getElementById('intake-content');
    var countEl = document.getElementById('submission-count');

    try {
      var data = await GHL.listContacts({ limit: 100, noCache: true });
      var contacts = data.contacts || [];

      // Filter for intake-submitted tag
      var submissions = contacts.filter(function(c) {
        var tags = c.tags || [];
        return tags.indexOf('intake-submitted') !== -1;
      });

      // Sort by dateAdded descending (most recent first)
      submissions.sort(function(a, b) {
        return new Date(b.dateAdded || 0).getTime() - new Date(a.dateAdded || 0).getTime();
      });

      countEl.textContent = submissions.length + ' total';

      if (submissions.length === 0) {
        container.innerHTML = '<div class="admin-empty">' +
          '<svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">' +
          '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>' +
          '<polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/>' +
          '<line x1="16" y1="17" x2="8" y2="17"/></svg>' +
          '<p>No intake submissions yet. Share your intake form link to get started.</p></div>';
        return;
      }

      renderTable(submissions);

    } catch (err) {
      console.error('Failed to load intake submissions:', err);
      countEl.textContent = '';
      container.innerHTML = '<div class="admin-empty" style="color:var(--red);">' +
        '<p>Failed to load submissions. Check console for details.</p></div>';
    }
  }

  function renderTable(submissions) {
    var container = document.getElementById('intake-content');

    var html = '<div class="admin-table-wrap"><table class="admin-table">';
    html += '<thead><tr>';
    html += '<th>Business Name</th>';
    html += '<th>Contact Name</th>';
    html += '<th>Email</th>';
    html += '<th>Phone</th>';
    html += '<th>Industry</th>';
    html += '<th>Date</th>';
    html += '</tr></thead>';
    html += '<tbody>';

    submissions.forEach(function(c) {
      var businessName = c.companyName || '--';
      var contactName = ((c.firstName || '') + ' ' + (c.lastName || '')).trim() || 'No Name';
      var email = c.email || '--';
      var phone = c.phone ? GHL.formatPhone(c.phone) : '--';
      var contactId = c.id || '';
      var added = c.dateAdded ? GHL.formatDate(c.dateAdded) : '--';
      var tags = c.tags || [];

      // Determine industry from tags
      var industry = '--';
      for (var i = 0; i < INDUSTRY_TAGS.length; i++) {
        if (tags.indexOf(INDUSTRY_TAGS[i]) !== -1) {
          industry = INDUSTRY_TAGS[i].replace(/-/g, ' ');
          industry = industry.charAt(0).toUpperCase() + industry.slice(1);
          break;
        }
      }

      html += '<tr onclick="window.location.href=\'contacts.html#' + contactId + '\'" role="button" tabindex="0">';
      html += '<td class="name-cell">' + escapeHtml(businessName) + '</td>';
      html += '<td>' + escapeHtml(contactName) + '</td>';
      html += '<td class="muted">' + escapeHtml(email) + '</td>';
      html += '<td class="muted">' + escapeHtml(phone) + '</td>';
      html += '<td class="muted" style="text-transform:capitalize;">' + escapeHtml(industry) + '</td>';
      html += '<td class="muted">' + escapeHtml(added) + '</td>';
      html += '</tr>';
    });

    html += '</tbody></table></div>';
    container.innerHTML = html;
  }

  // === UTILITY ===
  function escapeHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // Init
  loadIntakeSubmissions();

})();
</script>
<script src="/shared/ui-dark.js" defer></script>
</body>
</html>

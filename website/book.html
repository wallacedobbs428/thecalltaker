<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Continue to the Gideon demo | The Call Taker</title>
  <script>
    (function () {
      var incoming = new URLSearchParams(window.location.search), target = new URL('/demo.html', window.location.origin);
      var stored = {};
      try { stored = JSON.parse(sessionStorage.getItem('tct_attribution') || '{}'); } catch (_) {}
      function safeValue(key, raw) {
        var value = (raw || '').toString().trim();
        if (key === 'correlation_id' && !/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(value)) return '';
        if (key === 'tct_item_id' && !/^[A-Za-z0-9][A-Za-z0-9._:-]{0,119}$/.test(value)) return '';
        if ((key === 'tct_asset_sha256' || key === 'tct_publication_seed_sha256') && !/^[a-f0-9]{64}$/i.test(value)) return '';
        return value.slice(0, 128);
      }
      ['source','utm_source','utm_medium','utm_campaign','utm_content','utm_term','correlation_id','tct_item_id','tct_asset_sha256','tct_publication_seed_sha256'].forEach(function (key) {
        var value = incoming.get(key);
        if (key.indexOf('tct_') === 0) value = safeValue(key, value) || safeValue(key, stored[key] || (key === 'tct_item_id' ? stored.content_key : ''));
        if (!value && key === 'source') value = stored.source;
        if (!value && key.indexOf('utm_') === 0) value = stored[key];
        if (key === 'correlation_id' && !safeValue(key, value)) {
          try { value = sessionStorage.getItem('tct_correlation_id_v1') || ''; } catch (_) { value = ''; }
        }
        value = safeValue(key, value);
        if (value) target.searchParams.set(key, value);
      });
      if (!target.searchParams.has('source')) target.searchParams.set('source', 'legacy-book-route');
      target.hash = 'consented-demo-lead';
      window.location.replace(target.pathname + target.search + target.hash);
    }());
  </script>
</head>
<body><p>Continuing to the <a href="/demo.html?source=legacy-book-route#consented-demo-lead">Gideon demo and optional follow-up request</a>…</p></body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111318"/>
      <stop offset="100%" style="stop-color:#0a0c10"/>
    </linearGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6ee7b7"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>

  <!-- Full bleed background -->
  <rect x="0" y="0" width="1080" height="1080" fill="url(#bg)"/>

  <!-- Headset icon scaled up 1.6x -->
  <g transform="translate(540, 460) scale(1.6)">
    <!-- Arc (headband) -->
    <path d="M -160,20 A 190,200 0 0,1 160,20"
          fill="none" stroke="url(#g)" stroke-width="32" stroke-linecap="round"/>

    <!-- Left earpiece -->
    <rect x="-175" y="0" width="50" height="120" rx="25" fill="url(#g)"/>

    <!-- Right earpiece -->
    <rect x="125" y="0" width="50" height="120" rx="25" fill="url(#g)"/>

    <!-- Mic arm from right earpiece -->
    <path d="M 150,120 L 150,160 Q 150,190 120,190 L 60,190"
          fill="none" stroke="url(#g)" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- Brand text bigger -->
  <text x="540" y="830" text-anchor="middle"
        font-family="Inter, -apple-system, Helvetica Neue, Arial, sans-serif"
        font-size="72" font-weight="500" fill="#94a3b8" letter-spacing="8">
    THE CALL TAKER
  </text>
</svg>
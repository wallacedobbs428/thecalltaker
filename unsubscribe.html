<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Unsubscribe — The Call Taker</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0c10;
      --surface: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
      --green: #00dc82;
      --green-dim: rgba(0,220,130,0.08);
      --green-glow: rgba(0,220,130,0.15);
      --text-1: #ffffff;
      --text-2: #a1a1aa;
      --text-3: #71717a;
      --red: #ef4444;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-2);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .logo {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 48px;
    }
    .logo span {
      color: var(--green);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text-2);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .form-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="email"] {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-1);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="email"]:focus {
      border-color: var(--green);
    }
    input[type="email"]::placeholder {
      color: var(--text-3);
    }

    .btn-unsub {
      width: 100%;
      padding: 14px;
      background: var(--text-1);
      color: var(--bg);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-unsub:hover {
      opacity: 0.9;
    }
    .btn-unsub:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 16px;
    }
    .message.success {
      display: block;
      background: var(--green-dim);
      border: 1px solid var(--green-glow);
      color: var(--green);
    }
    .message.error {
      display: block;
      background: rgba(239,68,68,0.06);
      border: 1px solid rgba(239,68,68,0.15);
      color: var(--red);
    }

    .back-link {
      display: inline-block;
      margin-top: 32px;
      font-size: 14px;
      color: var(--text-3);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: var(--green);
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(10,12,16,0.2);
      border-top-color: var(--bg);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      h1 { font-size: 20px; }
      .form-box { padding: 24px 18px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">The Call <span>Taker</span></div>

    <h1>Unsubscribe</h1>
    <p class="subtitle">Enter your email address below and we'll remove you from all future communications.</p>

    <div class="form-box">
      <form id="unsubForm">
        <div class="input-group">
          <input type="email" id="emailInput" placeholder="you@company.com" required autocomplete="email">
          <button type="submit" class="btn-unsub" id="submitBtn">Unsubscribe</button>
        </div>
      </form>
      <div id="msgBox" class="message"></div>
    </div>

    <a href="https://thecalltaker.com" class="back-link">Changed your mind? Go back to thecalltaker.com</a>
  </div>

  <script>
    (function() {
      var GHL_BASE = 'https://services.leadconnectorhq.com';
      var API_KEY = 'pit-771d5b3f-847e-4cbe-8707-77ddc0f24b35';
      var LOCATION_ID = 'tQb9YmrGDrdVUJYPKrsY';
      var HEADERS = {
        'Authorization': 'Bearer ' + API_KEY,
        'Version': '2021-07-28',
        'Content-Type': 'application/json',
        'User-Agent': 'TheCallTaker/1.0'
      };

      var form = document.getElementById('unsubForm');
      var emailInput = document.getElementById('emailInput');
      var submitBtn = document.getElementById('submitBtn');
      var msgBox = document.getElementById('msgBox');

      function showMsg(text, type) {
        msgBox.className = 'message ' + type;
        msgBox.textContent = text;
      }

      function setLoading(on) {
        if (on) {
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="spinner"></span>Processing...';
        } else {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Unsubscribe';
        }
      }

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var email = emailInput.value.trim().toLowerCase();
        if (!email) return;

        msgBox.className = 'message';
        msgBox.style.display = 'none';
        setLoading(true);

        // Step 1: Search for contact by email
        fetch(GHL_BASE + '/contacts/search/duplicate?locationId=' + LOCATION_ID + '&email=' + encodeURIComponent(email), {
          method: 'GET',
          headers: HEADERS
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var contact = data.contact;
          if (!contact || !contact.id) {
            setLoading(false);
            showMsg("We couldn't find that email in our system.", 'error');
            return;
          }

          // Step 2: Add "unsubscribed" tag
          var existingTags = contact.tags || [];
          if (existingTags.indexOf('unsubscribed') === -1) {
            existingTags.push('unsubscribed');
          }

          return fetch(GHL_BASE + '/contacts/' + contact.id, {
            method: 'PUT',
            headers: HEADERS,
            body: JSON.stringify({ tags: existingTags })
          })
          .then(function(res) { return res.json(); })
          .then(function() {
            setLoading(false);
            form.style.display = 'none';
            showMsg("You've been unsubscribed. We're sorry to see you go.", 'success');
          });
        })
        .catch(function() {
          setLoading(false);
          showMsg('Something went wrong. Please try again or email thecalltakerai@gmail.com.', 'error');
        });
      });
    })();
  </script>
</body>
</html>

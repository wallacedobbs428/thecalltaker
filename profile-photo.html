<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profile Photo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1080px;
    background: #0a0c10;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }
  .monogram {
    font-family: 'Inter', sans-serif;
    font-weight: 900;
    font-size: 320px;
    letter-spacing: -16px;
    line-height: 1;
    color: #fff;
  }
  .monogram span {
    color: #10b981;
  }
  .divider {
    width: 120px;
    height: 4px;
    background: #10b981;
    border-radius: 2px;
  }
  .name {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 48px;
    letter-spacing: 10px;
    text-transform: uppercase;
    color: #94a3b8;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="monogram">C<span>T</span></div>
    <div class="divider"></div>
    <div class="name">The Call Taker</div>
  </div>
</body>
</html>
